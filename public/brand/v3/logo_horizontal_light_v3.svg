<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <linearGradient id="solanaGradLight3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="680" height="180" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- CANONICAL ICON (Padrão de Referência Aprovado) -->
  <g transform="translate(36, 20)">
    <!-- Hexagon Outer -->
    <polygon points="70,10 126,42 126,106 70,138 14,106 14,42" fill="#F8FAFC" stroke="url(#solanaGradLight3)" stroke-width="2.5" />
    
    <!-- Cap Top Rhombus -->
    <polygon points="70,28 116,52 70,76 24,52" fill="url(#solanaGradLight3)" />
    
    <!-- 3 Parallel Speed Bars -->
    <path d="M 42 88 L 98 88 L 92 98 L 36 98 Z" fill="#059669" />
    <path d="M 48 104 L 104 104 L 98 114 L 42 114 Z" fill="#0284C7" />
    <path d="M 38 120 L 94 120 L 88 130 L 32 130 Z" fill="#7C3AED" />

    <!-- Tassel Cord & Dot (Linha do cordão + bolinha única sem caixa) -->
    <path d="M 70,52 Q 100,65 104,85" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
    <circle cx="104" cy="88" r="4" fill="#059669" />
  </g>

  <!-- Divider Line -->
  <line x1="200" y1="35" x2="200" y2="145" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Typography Section -->
  <g transform="translate(232, 0)">
    <text x="0" y="98" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#0F172A">Lattes</tspan><tspan fill="url(#solanaGradLight3)">Chain</tspan>
    </text>

    <text x="4" y="134" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#64748B">
      EDUCORE PROTOCOL
    </text>
  </g>
</svg>
