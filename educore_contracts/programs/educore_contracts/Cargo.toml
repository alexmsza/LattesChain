[package]
name = "educore_contracts"
version = "0.1.0"
description = "EduCore Protocol Smart Contracts for LattesChain"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "educore_contracts"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "1.18.0"

[dev-dependencies]
anchor-test = "0.29.0"
